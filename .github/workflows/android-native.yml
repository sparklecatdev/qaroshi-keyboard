name: Native Android IME
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Sync audited offline lexicon and maps
        run: python3 scripts/prepare-mobile-native.py
      - name: Build native installable Android APK
        run: gradle -p android --no-daemon :app:assembleDebug --stacktrace
      - name: Publish Android APK
        uses: actions/upload-artifact@v4
        with:
          name: qaroshi-android-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
