name: Desktop keyboards
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  desktop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Keyman compiler
        run: npm install -g @keymanapp/kmc@18
      - name: Compile and test three desktop layouts
        run: bash scripts/build-desktop.sh
      - name: Publish desktop artifacts
        uses: actions/upload-artifact@v4
        with:
          name: qaroshi-desktop-keyboards
          path: layouts/*/build/*_desktop.kmp
          if-no-files-found: error
