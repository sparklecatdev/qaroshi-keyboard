name: Build and test
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  keyman-packages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Keyman Developer command line
        run: npm install --global @keymanapp/kmc@18
      - name: Verify source structure and letter maps
        run: python3 -m unittest discover -s tests -v
      - name: Compile all three desktop and touch keyboard packages
        run: bash scripts/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: qaroshi-keyman-packages
          path: layouts/*/build/*.kmp
          if-no-files-found: error
      - name: Publish downloadable release on version tags
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" layouts/*/build/*.kmp --title "Qaroshi Keyboard ${GITHUB_REF_NAME}" --notes "Three installable Keyman packages for QWERTY, AZERTY and Dvorak. Romanized Qaroshi output; see README for setup."
